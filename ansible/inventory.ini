
[inet_router]
inetRouter ansible_host=192.168.255.1 ansible_user=vagrant ansible_ssh_private_key_file=/home/vagrant/.ssh/ansible/inetRouter_key ansible_ssh_common_args='-o ProxyCommand="ssh -i /home/vagrant/.ssh/ansible/centralRouter_key -o StrictHostKeyChecking=no -W %h:%p vagrant@192.168.0.1"'

[central_router]
centralRouter ansible_host=192.168.0.1 ansible_user=vagrant ansible_ssh_private_key_file=/home/vagrant/.ssh/ansible/centralRouter_key

[inet_router2]
inetRouter2 ansible_host=192.168.0.3 ansible_user=vagrant ansible_ssh_private_key_file=/home/vagrant/.ssh/ansible/inetRouter2_key

[central_server]
centralServer ansible_connection=local

[all:vars]
ansible_python_interpreter=/usr/bin/python3
