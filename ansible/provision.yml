---
- hosts: all
  become: yes

  tasks:
    - name: Enable IPv4 forwarding on routers
      sysctl:
        name: net.ipv4.conf.all.forwarding
        value: '1'
        state: present
        sysctl_set: yes
        reload: yes
      when: "'routers' in group_names"

    - name: Disable DHCP routes on non-inetRouter hosts
      template:
        src: 00-installer-config.yaml
        dest: /etc/netplan/00-installer-config.yaml
        owner: root
        group: root
        mode: '0644'
      when: inventory_hostname != "inetRouter"
      notify: apply netplan

    - name: Set up NAT on inetRouter
      template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - src: iptables_rules.ipv4
          dest: /etc/iptables_rules.ipv4
          mode: '0644'
        - src: iptables_restore
          dest: /etc/network/if-pre-up.d/iptables
          mode: '0755'
      when: inventory_hostname == "inetRouter"

    - name: Add network routes for hosts and routers
      template:
        src: "50-vagrant_{{ inventory_hostname }}.yaml"
        dest: /etc/netplan/50-vagrant.yaml
        owner: root
        group: root
        mode: '0644'
      notify: apply netplan

    - name: Validate Netplan configuration
      command: netplan generate
      changed_when: false

  handlers:
    - name: apply netplan
      command: netplan apply